<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>제출현황 확인 — 신경외과 수련 로그북</title>
<!--
  실시간 제출현황 페이지 (손으로 관리 — scripts/build_reports.py가 만들지 않는다).
  응답 시트 웹앱(automation/sheet-webapp.gs v3)의 fn=status JSON을 열릴 때마다 읽어 그린다.
  "수정" 링크는 비밀번호(POST → Apps Script 속성 EDIT_PW 대조)를 통과해야만 내려온다.
  월별 정적 스냅샷은 status/<YYYY-MM>.html — 위키 반영 기준 아카이브로 계속 빌드된다.
-->
<style>
:root{
  --navy:#14385C; --navy-deep:#0E2A46; --blue:#1B6BB3; --teal:#0E7D6B; --teal-dark:#0B6A5B;
  --bg:#F4F7FA; --ink:#2B3A4A; --muted:#7B8794; --line:#E3E9EF;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--ink);padding:32px 16px;line-height:1.6;}
.wrap{max-width:840px;margin:0 auto;}
.card{background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(20,56,92,.10);
  padding:36px 40px;margin-bottom:24px;}
h2{color:var(--navy);font-size:19px;margin:26px 0 14px;display:flex;align-items:center;gap:10px;}
h2::before{content:"";flex:none;width:4px;height:18px;background:var(--blue);border-radius:2px;}
h2:first-child{margin-top:0;}
h3{color:var(--blue);font-size:14px;margin:20px 0 8px;font-weight:700;position:relative;padding-left:12px;}
h3::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;
  border-radius:2px;background:var(--blue);}
table{width:100%;border-collapse:collapse;margin:10px 0 6px;font-size:14px;}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:center;white-space:nowrap;}
th{background:var(--bg);color:var(--navy);font-weight:700;}
td:first-child, th:first-child{text-align:left;}
/* 수술·시술명 열만 줄바꿈 허용 — 나머지가 세로로 꺾이는 것을 막고 긴 이름은 접는다 */
td:nth-child(3), th:nth-child(3){white-space:normal;min-width:150px;word-break:keep-all;}
ul{margin:6px 0 6px 20px;}
li{margin:4px 0;}
.card ul li{list-style:none;position:relative;padding-left:15px;}
.card ul li::before{content:"";position:absolute;left:0;top:.62em;
  width:5px;height:5px;border-radius:1.5px;background:#9DB1C7;}
p{margin:6px 0;}
td a, li a{color:var(--blue);text-decoration:none;}
td a:hover, li a:hover{text-decoration:underline;}
.empty{color:var(--muted);font-style:italic;}
.ok{color:var(--teal);font-weight:700;}
.wait{color:#B3401B;font-weight:700;}
.row-wait td{background:#FDF6F2;}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;font-weight:700;white-space:nowrap;}
.pill.done{background:#E7F4F1;color:var(--teal);}
.pill.pending{background:#FBEAE2;color:#B3401B;}
.notice{border-left:4px solid var(--blue);background:#F1F7FD;border-radius:0 12px 12px 0;
  padding:14px 18px;margin:10px 0;font-size:14px;}
.notice .n-title{font-weight:700;color:var(--navy);margin:12px 0 4px;}
.notice ul{margin:0 0 2px 4px;}
.notice ul li{list-style:none;position:relative;padding-left:15px;margin:3px 0;}
.notice ul li::before{content:"";position:absolute;left:0;top:.62em;
  width:5px;height:5px;border-radius:1.5px;background:#6C93B8;}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.masthead{background:linear-gradient(135deg,var(--navy-deep),var(--navy));
  color:#fff;border-radius:18px;padding:28px 36px 30px;margin-bottom:24px;
  box-shadow:0 10px 30px rgba(11,32,54,.28);}
.masthead .mh-back{display:inline-block;margin-bottom:14px;color:#9FB8D2;
  font-size:14px;text-decoration:none;}
.masthead .mh-back:hover{color:#fff;}
.masthead .mh-eyebrow{color:#7E9BB8;font-size:12px;letter-spacing:3px;margin-bottom:10px;}
.masthead h1{color:#fff;font-size:26px;line-height:1.3;word-break:keep-all;}
.masthead .mh-rule{width:54px;height:4px;background:#3E7CB8;border-radius:2px;margin:16px 0 0;}
.masthead .mh-meta{color:#AEC2D6;font-size:14px;margin-top:14px;}
.masthead .mh-meta a{color:#CFE0EF;}
.pagemark{text-align:center;color:var(--muted);font-size:11.5px;letter-spacing:2.5px;
  margin:20px 0 6px;}
.pagemark .dot{color:var(--blue);margin:0 8px;}
.month-nav{display:flex;justify-content:space-between;align-items:center;
  margin:-6px 2px 22px;font-size:14px;}
.month-nav a{color:var(--blue);text-decoration:none;font-weight:600;cursor:pointer;}
.month-nav a:hover{text-decoration:underline;}
.month-nav .mn-cur{color:var(--muted);font-weight:700;}
/* 수정 모드 */
.editbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;}
.editbar button{border:none;border-radius:8px;background:var(--blue);color:#fff;
  font-size:14px;font-weight:700;padding:8px 16px;cursor:pointer;font-family:inherit;}
.editbar button:hover{background:var(--navy);}
.editbar .edit-on{color:var(--teal);font-weight:700;font-size:14px;}
a.editlink{white-space:nowrap;}
a.pill-link{text-decoration:none;}
a.pill-link:hover .pill{box-shadow:0 2px 8px rgba(20,56,92,.18);}
/* 비밀번호 모달 */
#pwmodal{position:fixed;inset:0;background:rgba(14,42,70,.55);display:flex;
  align-items:center;justify-content:center;z-index:10;}
#pwmodal .box{background:#fff;border-radius:16px;padding:32px 28px;width:min(320px,90vw);text-align:center;}
#pwmodal .ttl{font-weight:700;color:var(--navy);font-size:17px;margin-bottom:4px;}
#pwmodal .sub{color:var(--muted);font-size:13px;}
#pwmodal input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin:14px 0 10px;}
#pwmodal .err{color:#B3401B;font-size:13px;min-height:18px;}
#pwmodal button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--blue);
  color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;}
#pwmodal button:hover{background:var(--navy);}
#pwmodal .close{background:none;color:var(--muted);font-size:13px;font-weight:400;
  margin-top:8px;padding:4px;}
#pwmodal .close:hover{background:none;color:var(--navy);}
.loading{color:var(--muted);text-align:center;padding:30px 0;}
/* 모바일: 표를 한 건 = 카드 한 장으로 */
@media (max-width:640px){
  .card{padding:24px 20px;}
  .tbl-scroll table, .tbl-scroll tbody, .tbl-scroll tr, .tbl-scroll td{display:block;width:100%;}
  .tbl-scroll thead{display:none;}
  .tbl-scroll tr{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:6px 14px;background:#fff;}
  .tbl-scroll tr.row-wait{background:#FDF6F2;}
  .tbl-scroll td{border:none;text-align:right;padding:5px 0;font-size:14px;white-space:normal;}
  .tbl-scroll .row-wait td{background:transparent;}
  .tbl-scroll td::before{content:attr(data-label);float:left;color:var(--muted);font-weight:700;margin-right:12px;}
}
</style>
</head>
<body>
<div class="wrap">

<div class="masthead">
<a class="mh-back" href="index.html">&larr; 로그북 입구</a>
<div class="mh-eyebrow">JEJU NATIONAL UNIVERSITY HOSPITAL</div>
<h1 id="mh-title">제출현황 확인</h1>
<div class="mh-rule"></div>
<div class="mh-meta" id="stamp">응답 시트에서 불러오는 중&hellip;</div>
</div>

<div class="month-nav" id="mnav" style="display:none;"></div>

<div class="card">
<div class="notice">제출한 기록은 이 페이지에 <strong>바로</strong> 나타납니다 (평가 내용 없이 제출 여부만).
<div class="n-title">수정 방법</div>
<ul>
<li><strong>전공의</strong> — 제출 확인 메일의 "응답 수정" 링크</li>
<li><strong>지도전문의</strong> — 아래 수정 모드 켜기 (비밀번호)</li>
<li><strong>매칭 대기 건</strong> — 목록에서 <strong>이어서 작성</strong> 클릭</li>
</ul>
<div class="editbar" id="editbar">
<button id="editbtn" type="button">&#9998; 수정 모드 켜기 (지도전문의)</button>
</div>
</div>
<h2 style="margin-top:18px;">매칭 대기 — 자기평가·피드백 중 한쪽만 있는 건</h2>
<div id="pending"><div class="loading">불러오는 중&hellip;</div></div>
</div>

<div id="sections"></div>

<div class="pagemark">수련로그.kr<span class="dot">&middot;</span>제주대학교 신경외과 수련 로그북</div>
</div>

<div id="pwmodal" style="display:none;">
  <div class="box">
    <div class="ttl">수정 모드</div>
    <div class="sub">비밀번호를 입력하세요</div>
    <form id="pwform">
      <input id="pw" type="password" autocomplete="off" />
      <div class="err" id="pwerr"></div>
      <button type="submit">확인</button>
      <button type="button" class="close" id="pwclose">닫기</button>
    </form>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyLYlN3hMdVAXQgoo21NxZk-V8LHGLk5Z-UqyU6hu0IBkrCyL8t4lfP2mlrp0Awre8/exec';
const MONTH_LABEL = m => m === '기타' ? '날짜 미상' : `${m.slice(0,4)}년 ${parseInt(m.slice(5),10)}월`;
let DATA = null, MONTH = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthOf = d => /^\d{4}-\d{2}/.test(d) ? d.slice(0,7) : '기타';

async function load(pw) {
  let data;
  try {
    const res = pw != null
      ? await fetch(API, { method:'POST', redirect:'follow',
          headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({pw}) })
      : await fetch(API + '?fn=status');
    data = await res.json();
  } catch (err) {
    showError('시트를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.');
    return false;
  }
  if (data.error) {
    if (data.error === 'wrong_password') return 'wrong';
    showError('오류: ' + data.error);
    return false;
  }
  DATA = data;
  const months = allMonths();
  if (!MONTH || !months.includes(MONTH)) MONTH = months[months.length - 1] || null;
  render();
  return true;
}

function allMonths() {
  const s = new Set();
  for (const r of DATA.residents)
    for (const rec of [...r.cases, ...r.weeklies, ...r.mentorings]) s.add(monthOf(rec.date));
  return [...s].sort((a, b) => (a === '기타') - (b === '기타') || a.localeCompare(b));
}

function showError(msg) {
  document.getElementById('stamp').textContent = '연결 실패';
  document.getElementById('pending').innerHTML = '';
  document.getElementById('sections').innerHTML =
    `<div class="card"><p class="empty">${esc(msg)}</p></div>`;
}

const fillLink = c => c.fillUrl
  ? ` · <a class="editlink" href="${esc(c.fillUrl)}" target="_blank" rel="noopener">이어서 작성 &rarr;</a>`
  : '';

function render() {
  const now = new Date();
  document.getElementById('stamp').innerHTML =
    `시트 실시간 반영 · 마지막 확인 ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')} · ` +
    `<a href="#" onclick="location.reload();return false;">새로고침</a>` +
    (DATA.editMode ? ' · <span style="color:#8FD3C6;font-weight:700;">수정 모드</span>' : '');

  const bar = document.getElementById('editbar');
  bar.innerHTML = DATA.editMode
    ? '<span class="edit-on">&#10003; 수정 모드(지도전문의)가 켜졌습니다 — 피드백·면담 기록 옆의 수정 링크를 누르면 제출한 폼이 열립니다.</span>'
    : '<button id="editbtn" type="button">&#9998; 수정 모드 켜기 (지도전문의)</button>';
  if (!DATA.editMode) document.getElementById('editbtn').onclick = openModal;

  // 월 내비
  const months = allMonths();
  const mnav = document.getElementById('mnav');
  if (months.length && MONTH) {
    const i = months.indexOf(MONTH);
    const prev = i > 0 ? months[i-1] : null;
    const next = i >= 0 && i + 1 < months.length ? months[i+1] : null;
    mnav.style.display = 'flex';
    mnav.innerHTML =
      (prev ? `<a onclick="setMonth('${prev}')">&larr; ${MONTH_LABEL(prev)}</a>` : '<span></span>') +
      `<span class="mn-cur">${MONTH_LABEL(MONTH)}</span>` +
      (next ? `<a onclick="setMonth('${next}')">${MONTH_LABEL(next)} &rarr;</a>` : '<span></span>');
    document.getElementById('mh-title').textContent = `제출현황 확인 — ${MONTH_LABEL(MONTH)}`;
  } else {
    mnav.style.display = 'none';
  }

  const inMonth = rec => monthOf(rec.date) === MONTH;

  // 매칭 대기
  const pend = [];
  for (const r of DATA.residents)
    for (const c of r.cases.filter(inMonth))
      if (!(c.self && c.fb)) {
        const missing = c.self ? '지도전문의 피드백' : '전공의 자기평가';
        pend.push(`<li><strong>${esc(r.name)}</strong> · ${esc(c.date)} · ${esc(c.opname)}` +
          (c.supervisor ? ` (${esc(c.supervisor)})` : '') +
          ` — <span class="wait">${missing} 대기</span>${fillLink(c)}</li>`);
      }
  document.getElementById('pending').innerHTML = pend.length
    ? `<ul>${pend.join('')}</ul>`
    : `<p class="empty">매칭 대기 중인 건이 없습니다. 모든 수술·시술 기록에 자기평가와 피드백이 갖춰졌습니다.</p>`;

  // 전공의별 카드
  let html = '';
  for (const r of DATA.residents) {
    const cases = r.cases.filter(inMonth), weeklies = r.weeklies.filter(inMonth),
          mentorings = r.mentorings.filter(inMonth);
    let caseHtml;
    if (cases.length) {
      const editTh = DATA.editMode ? '<th>수정</th>' : '';
      const rows = cases.map(c => {
        const wait = !(c.self && c.fb);
        let state = c.self && c.fb ? '<span class="pill done">매칭 완료</span>'
          : c.self ? '<span class="pill pending">피드백 대기</span>'
                   : '<span class="pill pending">자기평가 대기</span>';
        if (wait && c.fillUrl)  // 대기 필을 누르면 기본 정보가 채워진 폼으로
          state = `<a class="pill-link" href="${esc(c.fillUrl)}" target="_blank" rel="noopener" title="이어서 작성">${state}</a>`;
        const editTd = DATA.editMode
          ? `<td data-label="수정">${c.fbEdit ? `<a class="editlink" href="${esc(c.fbEdit)}" target="_blank" rel="noopener">피드백</a>` : '—'}</td>`
          : '';
        return `<tr${wait ? ' class="row-wait"' : ''}>` +
          `<td data-label="일자">${esc(c.date)}</td>` +
          `<td data-label="유형">${esc(c.kind || '—')}</td>` +
          `<td data-label="수술·시술명">${esc(c.opname)}</td>` +
          `<td data-label="지도전문의">${esc(c.supervisor)}</td>` +
          `<td data-label="자기평가">${c.self ? '<span class="ok">제출 ✓</span>' : '<span class="wait">미제출</span>'}</td>` +
          `<td data-label="피드백">${c.fb ? '<span class="ok">제출 ✓</span>' : '<span class="wait">미제출</span>'}</td>` +
          `<td data-label="상태">${state}</td>${editTd}</tr>`;
      }).join('');
      caseHtml = `<div class="tbl-scroll"><table><thead><tr><th>일자</th><th>유형</th><th>수술·시술명</th>` +
        `<th>지도전문의</th><th>자기평가</th><th>피드백</th><th>상태</th>${editTh}</tr></thead>` +
        `<tbody>${rows}</tbody></table></div>`;
    } else {
      caseHtml = `<p class="empty">반영된 수술·시술 기록이 없습니다.</p>`;
    }
    const wHtml = weeklies.length
      ? `<ul>${weeklies.map(w => `<li>${esc(w.date)} 제출 ✓</li>`).join('')}</ul>`
      : `<p class="empty">반영된 주간보고가 없습니다.</p>`;
    const mHtml = mentorings.length
      ? `<ul>${mentorings.map(m => `<li>${esc(m.date)}` +
          (m.supervisor ? ` (${esc(m.supervisor)})` : '') + ' 기록 ✓' +
          (DATA.editMode && m.edit ? ` · <a class="editlink" href="${esc(m.edit)}" target="_blank" rel="noopener">수정</a>` : '') +
          `</li>`).join('')}</ul>`
      : `<p class="empty">반영된 면담·지도기록이 없습니다.</p>`;
    html += `<div class="card"><h2>${esc(r.name)}</h2>` +
      `<h3>수술·시술 기록</h3>${caseHtml}` +
      `<h3>주간보고</h3>${wHtml}` +
      `<h3>면담·지도기록</h3>${mHtml}</div>`;
  }
  document.getElementById('sections').innerHTML =
    html || '<div class="card"><p class="empty">반영된 기록이 없습니다.</p></div>';
}

function setMonth(m) { MONTH = m; render(); }

function openModal() {
  document.getElementById('pwerr').textContent = '';
  document.getElementById('pwmodal').style.display = 'flex';
  document.getElementById('pw').focus();
}

document.getElementById('pwclose').onclick =
  () => document.getElementById('pwmodal').style.display = 'none';

document.getElementById('pwform').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value.normalize('NFC');
  if (!pw) return;
  document.getElementById('pwerr').textContent = '확인 중…';
  const ok = await load(pw);
  if (ok === true) {
    sessionStorage.setItem('status_edit_pw', pw);
    document.getElementById('pwmodal').style.display = 'none';
  } else if (ok === 'wrong') {
    document.getElementById('pwerr').textContent = '비밀번호가 틀렸습니다.';
    document.getElementById('pw').value = '';
  } else {
    document.getElementById('pwerr').textContent = '연결에 실패했습니다. 잠시 후 다시 시도해 주세요.';
  }
});

(async () => {
  const saved = sessionStorage.getItem('status_edit_pw');
  if (saved) {
    const ok = await load(saved);           // 이 세션에서 이미 인증됨 — 바로 수정 모드로
    if (ok === true) return;
    sessionStorage.removeItem('status_edit_pw');
  }
  await load();
})();
</script>
</body>
</html>
